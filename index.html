<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>App</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">

        <!-- CSS -->
        <link rel="stylesheet" href="styles.css">
    </head>
    <style>
            #title{
    background-color: #ff4c68;
    color: white;
    }

    /* Container-fluid */
    .container-fluid{
    padding: 3% 15%;
    }

    /* Fuente del eslogan */
    h1{
    font-family: 'Montserrat', sans-serif;
    font-size: 3rem;
    }

    /* Fuente del nombre de la app en la navbar */
    .app-name{
    font-family: 'Ubuntu', sans-serif;
    font-size: 2rem;
    }

    /* Eliminar fondo oscuro de navbar */
    .navbar{
    background-color: transparent;
    }
    </style>
    <body>

        <section id="title">

        <div class="container-fluid">

            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand app-name" href="#">MiApp</a>
            </nav>

            <!-- Row -->
            <div class="row">

            <!-- Columna 1 -->
            <div class="col-lg-6 col-md-12 col-sm-12">
                <h1>La mejor aplicación para organizar tu vida.</h1>

                <button type="button" class="btn btn-dark btn-lg">Descargar</button>
                <button type="button" class="btn btn-outline-light btn-lg">Descargar</button>
            </div>

            <!-- Columna 2 -->
            <div class="col-lg-6 col-md-12 col-sm-12">
                <img src="imagen-app.png" class="img-fluid" alt="App">
            </div>

            </div>

        </div>

        </section>

    </body>
</html>
